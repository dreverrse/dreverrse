    <style>.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.pulse{animation:p 3s ease-in-out infinite}@keyframes p{50%{opacity:.35}}.float{animation:f 5s ease-in-out infinite}@keyframes f{50%{transform:translateY(-7px)}}</style>
