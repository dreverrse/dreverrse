    <path d="M0 302Q245 240 480 305T960 292T1200 273" fill="none" stroke="url(#accent)" stroke-opacity=".55" stroke-width="2"/>
    <g fill="#cbd5e1" opacity=".62"><circle cx="77" cy="55" r="2"/><circle cx="233" cy="106" r="1.5"/><circle cx="540" cy="49" r="2"/><circle cx="708" cy="80" r="1.5"/><circle cx="1072" cy="53" r="2"/><circle cx="1131" cy="158" r="1.5"/></g>
