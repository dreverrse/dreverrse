<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="Projects">
  <title>Projects</title>
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bb9af7"/><stop offset="1" stop-color="#f7768e"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7768e" stop-opacity=".7"/><stop offset="1" stop-color="#f7768e" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif; } .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, Menlo, monospace; }
      .dot { animation: run 4s ease-in-out infinite; }
      @keyframes run { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(860px); opacity: 0; } }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect x="0" y="14" width="6" height="56" rx="3" fill="url(#t)"/>
  <rect x="22" y="14" width="56" height="56" rx="14" fill="#bb9af7" fill-opacity=".12" stroke="#bb9af7" stroke-opacity=".45"/>
  <text x="50" y="52" text-anchor="middle" font-size="28">🚀</text>
  <text x="96" y="46" class="sans" font-size="30" font-weight="800" fill="url(#t)">Projects</text>
  <text x="97" y="68" class="mono" font-size="14" fill="#565f89">❯ ls ~/projects<tspan class="blink" fill="#a9b1d6">▌</tspan></text>
  <rect x="270" y="41" width="900" height="2" rx="1" fill="url(#ln)"/>
  <circle class="dot" cx="270" cy="42" r="4" fill="#f7768e"/>
</svg>
